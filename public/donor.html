<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor Dashboard — SharePlate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🍽️ SharePlate</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small" id="userName"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">
      <!-- Post a donation -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h5 class="mb-3">🍱 Post a Donation</h5>
            <form id="donationForm">
              <div class="mb-3">
                <label class="form-label">Food Item</label>
                <input type="text" class="form-control" id="foodItem" placeholder="e.g. 20 veg meals" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="text" class="form-control" id="quantity" placeholder="e.g. 20 boxes / 5 kg" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Best Before</label>
                <input type="datetime-local" class="form-control" id="expiryTime" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Pickup Location</label>
                <input type="text" class="form-control" id="location" required>
              </div>
              <button class="btn btn-success w-100">Post Donation</button>
            </form>
          </div>
        </div>
      </div>

      <!-- My donations -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h5 class="mb-3">📋 My Donations</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Food</th><th>Qty</th><th>Location</th><th>Status</th><th>Actions</th>
                  </tr>
                </thead>
                <tbody id="donationRows"></tbody>
              </table>
            </div>
            <p id="emptyMsg" class="text-muted text-center d-none">No donations yet — post your first one! 🌱</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = requireRole('donor');
    document.getElementById('userName').textContent = '👋 ' + user.name;

    const statusClass = { 'Available': 'status-Available', 'Claimed': 'status-Claimed', 'Picked Up': 'status-PickedUp' };

    async function loadDonations() {
      const list = await api('/donations');
      const tbody = document.getElementById('donationRows');
      document.getElementById('emptyMsg').classList.toggle('d-none', list.length > 0);
      tbody.innerHTML = list.map(d => `
        <tr>
          <td>${d.foodItem}</td>
          <td>${d.quantity}</td>
          <td>${d.location}</td>
          <td><span class="badge ${statusClass[d.status]}">${d.status}</span></td>
          <td>
            ${d.status !== 'Picked Up'
              ? `<button class="btn btn-sm btn-outline-success" onclick="markPickedUp('${d._id}')">✔ Picked Up</button>` : ''}
            <button class="btn btn-sm btn-outline-danger" onclick="removeDonation('${d._id}')">🗑</button>
          </td>
        </tr>`).join('');
    }

    document.getElementById('donationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await api('/donations', {
        method: 'POST',
        body: JSON.stringify({
          foodItem: document.getElementById('foodItem').value,
          quantity: document.getElementById('quantity').value,
          expiryTime: document.getElementById('expiryTime').value,
          location: document.getElementById('location').value
        })
      });
      e.target.reset();
      loadDonations();
    });

    async function markPickedUp(id) {
      await api('/donations/' + id + '/status', { method: 'PUT', body: JSON.stringify({ status: 'Picked Up' }) });
      loadDonations();
    }

    async function removeDonation(id) {
      if (!confirm('Delete this donation?')) return;
      await api('/donations/' + id, { method: 'DELETE' });
      loadDonations();
    }

    loadDonations();
  </script>
</body>
</html>
