<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — SharePlate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🍽️ SharePlate</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h4 class="mb-3 text-center">Create Account</h4>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
              </div>
              <div class="mb-3">
                <label class="form-label">I am a</label>
                <select class="form-select" id="role" required>
                  <option value="donor">Donor (student / canteen / hostel)</option>
                  <option value="ngo">NGO / Recipient</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" id="location" placeholder="e.g. Hostel Block C, Canteen">
              </div>
              <button class="btn btn-success w-100">Register</button>
            </form>
            <p class="text-center mt-3 mb-0">Already have an account?
              <a href="login.html">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('role').value,
          location: document.getElementById('location').value
        })
      });
      alert('Registered! Please log in.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
